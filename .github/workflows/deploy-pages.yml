# Publishes only site/ to GitHub Pages (D-018).
#
# Manual trigger only. A push to main never deploys. The check runs with
# --strict, so any placeholder marker fails the run and blocks the deploy (D-017).
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exits 1 on any error, which fails the job. --strict makes placeholder
      # markers errors, so the site cannot deploy until they are replaced.
      - name: Run site checks
        run: python3 scripts/check_site.py --strict

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
